<main class="screen sound-screen">
  <div class="screen-dimmer"></div>
  <header class="screen-header">
    <h1 class="screen-title sound-title">SOUND CONFIG</h1>
    <nav class="screen-tabs">
      <button class="tab-button" data-action="save"><img class="tab-icon" src="ui/icons/save.png" alt=""><small class="tab-label">SAVE</small></button>
      <button class="tab-button" data-action="load"><img class="tab-icon" src="ui/icons/load.png" alt=""><small class="tab-label">LOAD</small></button>
      <button class="tab-button" data-action="open-screen" data-target="system"><img class="tab-icon" src="ui/icons/system.png" alt=""><small class="tab-label">SYSTEM</small></button>
      <button class="tab-button tab-active" data-action="open-screen" data-target="sound"><img class="tab-icon" src="ui/icons/sound.png" alt=""><small class="tab-label">SOUND</small></button>
      <button class="tab-button" data-action="open-screen" data-target="guide"><img class="tab-icon" src="ui/icons/favorite.png" alt=""><small class="tab-label">FAVORITE</small></button>
      <button class="tab-button" data-action="open-screen" data-target="about"><img class="tab-icon" src="ui/icons/tips.png" alt=""><small class="tab-label">TIPS</small></button>
    </nav>
  </header>
  <section class="volume-panel">
    <div class="volume-row volume-row-0"><div class="volume-name">Master Volume</div></div>
    <div class="volume-row volume-row-1"><div class="volume-name">BGM Volume</div></div>
    <div class="volume-row volume-row-2"><div class="volume-name">SE Volume</div></div>
    <div class="volume-row volume-row-4"><div class="volume-name">Voice Volume</div></div>
    <input class="audio-control audio-master" type="range" min="0" max="1" step="0.01" data-setting="audio.master" data-skin="volume" aria-label="Master Volume">
    <input class="audio-control audio-bgm" type="range" min="0" max="1" step="0.01" data-setting="audio.bgm" data-skin="volume" aria-label="BGM Volume">
    <input class="audio-control audio-se" type="range" min="0" max="1" step="0.01" data-setting="audio.se" data-skin="volume" aria-label="SE Volume">
    <input class="audio-control audio-voice" type="range" min="0" max="1" step="0.01" data-setting="audio.voice" data-skin="volume" aria-label="Voice Volume">
    <input class="audio-mute audio-bgm-mute" type="checkbox" data-setting="audio.bgmMuted" data-skin="mute" aria-label="Mute BGM"><small class="audio-mute-label audio-bgm-mute-label">Mute</small>
    <input class="audio-mute audio-se-mute" type="checkbox" data-setting="audio.seMuted" data-skin="mute" aria-label="Mute SE"><small class="audio-mute-label audio-se-mute-label">Mute</small>
    <input class="audio-mute audio-voice-mute" type="checkbox" data-setting="audio.voiceMuted" data-skin="mute" aria-label="Mute Voice"><small class="audio-mute-label audio-voice-mute-label">Mute</small>
    <div class="dialog-opacity-label">Message Window Opacity</div><input class="audio-control dialog-opacity-control" type="range" min="0" max="1" step="0.01" data-setting="ui.dialogOpacity" data-skin="volume" aria-label="Message Window Opacity">
    <section class="sound-limit"><h2 class="sound-limit-heading">Character Voice</h2><small class="sound-description">各キャラクターの音声だけを個別に調整できます。キャラクターIDを指定した voice 再生に反映されます。</small>
      <article class="sound-voice-card"><img class="sound-portrait" src="ui/portraits/ayaka-volume.png" alt=""><strong class="sound-character">綾瀬 あやか</strong><small class="sound-voice-id">ayaka</small><input class="voice-character-volume" type="range" min="0" max="1" step="0.01" data-setting="audio.voice.ayaka" data-skin="volume" aria-label="Voice Volume: Ayaka Ayase"><input class="voice-character-mute" type="checkbox" data-setting="audio.voice.ayaka.muted" data-skin="mute" aria-label="Mute Ayaka Ayase"><small class="voice-character-mute-label">Mute</small></article>
      <article class="sound-voice-card sound-voice-card-sister"><img class="sound-portrait" src="ui/portraits/sister-volume.png" alt=""><strong class="sound-character">妹</strong><small class="sound-voice-id">sister</small><input class="voice-character-volume" type="range" min="0" max="1" step="0.01" data-setting="audio.voice.sister" data-skin="volume" aria-label="Voice Volume: Sister"><input class="voice-character-mute" type="checkbox" data-setting="audio.voice.sister.muted" data-skin="mute" aria-label="Mute Sister"><small class="voice-character-mute-label">Mute</small></article>
    </section>
  </section>
  <small class="screen-note">変更内容はこの作品のPlayer settingsとして自動保存されます。</small>
  <div class="settings-footer sound-footer"><button class="footer-button settings-reset" data-action="reset-settings">初期設定に戻す</button><button class="footer-button settings-back" data-action="back">戻る</button><button class="footer-button settings-title" data-action="open-screen" data-target="title">タイトルへ戻る</button><button class="footer-button settings-quit" data-action="quit">ゲーム終了</button></div>
</main>
