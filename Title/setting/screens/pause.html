<main class="screen pause-screen">
  <div class="pause-dimmer"></div>
  <section class="pause-panel">
    <div class="pause-heading">しおり</div>
    <div class="pause-rule"></div>
    <div class="pause-grid">
      <button class="pause-button" data-action="resume">物語へ戻る</button>
      <button class="pause-button" data-action="save">この場面を記録</button>
      <button class="pause-button" data-action="load">記録から再開</button>
      <button class="pause-button" data-action="open-screen" data-target="system">環境設定</button>
      <button class="pause-button" data-action="open-screen" data-target="title">表紙へ戻る</button>
    </div>
  </section>
</main>
