<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>if (new URLSearchParams(location.search).has('desktop')) document.documentElement.classList.add('electron-desktop');</script><title>Scene Flow</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/flow.css"></head>
<body>
<header class="topbar titlebar"><div class="brand"><img class="brand-icon" src="/assets/desktop-icon.png" alt="" aria-hidden="true"><div class="brand-mark">.tds</div><nav class="menu-bar" aria-label="メインメニュー"><div class="menu-item"><button type="button" data-flow-action="editor">ファイル</button></div><div class="menu-item"><button type="button" data-flow-action="editor">編集</button></div><div class="menu-item"><button type="button" data-flow-action="editor">選択</button></div><div class="menu-item"><button type="button" data-flow-action="toggle-details">表示</button></div><div class="menu-item"><button type="button" data-flow-action="help">ヘルプ</button></div></nav></div><div class="window-title">Scene Flow</div><div class="topbar-right"><div class="status-chip flow-status" role="status"><span class="status-dot"></span><span id="status">読み込み中…</span></div><span class="version">v0.1</span></div></header>
